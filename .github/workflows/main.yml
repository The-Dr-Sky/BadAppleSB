
name: Build BadAppleSB for Nyxian

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          brew install ldid dpkg ffmpeg
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Prepare SDK
        run: |
          mkdir -p "$HOME/theos/sdks"
          git clone --depth=1 https://github.com/theos/sdks.git /tmp/theos-sdks
          cp -R /tmp/theos-sdks/*.sdk "$HOME/theos/sdks/"

      - name: Generate animation assets
        run: |
          test -f badapple.mp4 || {
            echo "Upload badapple.mp4 to the repository root first"
            exit 1
          }
          python3 scripts/generate_assets.py --input badapple.mp4

      - name: Build package
        run: |
          make clean package FINALPACKAGE=1

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: BadAppleSB-Nyxian
          path: packages/*.deb
          if-no-files-found: error
